[project]
name = "engineering-audit"
version = "1.0.0"
description = "Benchmark-driven verifier for LLM-generated mechanical engineering calculations."
requires-python = ">=3.11"
dependencies = [
  "pint>=0.23",
  "pydantic>=2.7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
  # numpy is used only by tests, as an independent oracle that validates the
  # analytically/FEA-grade ground-truth reference cases (e.g. numerical
  # double-integration of beam curvature). It is not a runtime dependency.
  "numpy>=1.26",
]
# Workstation-side client for cadloop's FEA stage. Connects over gRPC to a
# licensed MAPDL instance on the CAD host; installs nothing on the host
# itself, so it does not appear in cadloop's host requirements.
fea = [
  "ansys-mapdl-core>=0.68",
]

[project.scripts]
engineering-audit = "engineering_audit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["engineering_audit*"]
